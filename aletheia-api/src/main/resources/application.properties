# ═══════════════════════════════════════════════════════════════════
# Aletheia — Application Configuration
# ═══════════════════════════════════════════════════════════════════
# Spring Boot reads this file on startup.
# These are DEV defaults — override with environment variables in prod.
# Convention: spring.datasource.url is overridden by env var
#             SPRING_DATASOURCE_URL (dots become underscores, uppercase)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=aletheia-hft

# ── Database ──────────────────────────────────────────────────────
# TimescaleDB IS PostgreSQL — same driver, same config
spring.datasource.url=jdbc:postgresql://localhost:5433/aletheia
spring.datasource.username=alethia
spring.datasource.password=dev_only
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Actuator ─────────────────────────────────────────────────────
# Exposes /actuator/health and /actuator/prometheus endpoints
# Prometheus scrapes /actuator/prometheus every 15 seconds
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ── Server ───────────────────────────────────────────────────────
server.port=8080

# ── OANDA API ─────────────────────────────────────────────────────
# These values can be overridden by environment variables:
#   OANDA_API_KEY, OANDA_ACCOUNT_ID, OANDA_STREAM_URL
# In production, the API key comes from AWS Secrets Manager.
# For local dev, set them in your .env file or export them in your shell.
oanda.api-key=${OANDA_API_KEY:not-set}
oanda.account-id=${OANDA_ACCOUNT_ID:not-set}
oanda.stream-url=${OANDA_STREAM_URL:https://stream-fxpractice.oanda.com/v3}

# ── Trading Configuration ────────────────────────────────────────
# Which instruments to stream — comma-separated
trading.instruments=EUR_USD,GBP_USD

# ── Tick Repository ──────────────────────────────────────────────
# How many ticks to buffer before flushing to the database
tick.batch-size=100
